<svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 体重秤底座（圆润方形，深色形成对比） -->
  <rect x="8" y="20" width="40" height="26" rx="7" fill="#3A3A3A"/>
  <!-- 秤面（白色显示区） -->
  <rect x="12" y="25" width="32" height="11" rx="4" fill="#FFFFFF"/>
  <!-- 折线趋势（压在秤面上，上升表示体重变化） -->
  <polyline points="16,32 22,29 28,30 34,26 40,27" stroke="#FF6B81" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- 趋势终点小圆点（强调当前值） -->
  <circle cx="40" cy="27" r="2.6" fill="#FF6B81"/>
  <!-- 顶部称重台面（薄板） -->
  <rect x="6" y="14" width="44" height="6" rx="3" fill="#4A4A4A"/>
  <!-- 台面高光 -->
  <rect x="10" y="15.5" width="10" height="2" rx="1" fill="#FFFFFF" opacity="0.4"/>
  <!-- 底部装饰条 -->
  <rect x="12" y="40" width="32" height="2" rx="1" fill="#5A5A5A"/>
</svg>
